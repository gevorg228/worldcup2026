<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Не кэшировать сам HTML: иначе браузер тянет старый index.html со старыми ?v=N
       и обновления «не появляются». Ассеты по-прежнему кэшируются по ?v=N. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Альбом ЧМ-2026 — наклейки</title>
  <!-- Фавиконка: футбольный мячик (inline SVG, без отдельного файла) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <!-- ?v=N — версия для сброса кэша; повышается при каждом обновлении -->
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>
  <main id="view"><!-- сюда рендерится главная / страница набора --></main>

  <script src="js/data.js?v=20"></script>
  <script src="js/store.js?v=20"></script>
  <script src="js/progress.js?v=20"></script>
  <script src="js/report.js?v=20"></script>
  <script src="js/render.js?v=20"></script>
  <script src="js/app.js?v=20"></script>
</body>
</html>
